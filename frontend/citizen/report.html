<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Civic AI — Report a civic issue." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../assets/css/style.css" />
  <title>Report Civic Issue · Civic AI</title>
</head>
<body>
  <div class="app-shell">
    <button type="button" aria-label="Close navigation" class="sidebar-overlay" hidden></button>
    <aside class="sidebar">
      <div class="sidebar-brand">
        <a href="../index.html" class="sidebar-brand-link">
          <span class="brand-mark">CA</span>
          <span class="brand-name">Civic AI</span>
        </a>
        <button type="button" aria-label="Close navigation" class="sidebar-close">
          <svg width="20" height="20" aria-hidden="true"><use href="../assets/icons.svg#icon-x"></use></svg>
        </button>
      </div>

      <nav class="sidebar-nav scroll-thin" aria-label="Citizen navigation">
        <p class="sidebar-nav-label">Citizen Portal</p>
        <a href="dashboard.html" class="nav-link">
          <svg width="18" height="18" aria-hidden="true"><use href="../assets/icons.svg#icon-layout-dashboard"></use></svg>
          Dashboard
        </a>
        <a href="report.html" class="nav-link nav-link-active">
          <svg width="18" height="18" aria-hidden="true"><use href="../assets/icons.svg#icon-file-plus"></use></svg>
          Report Issue
        </a>`
        <a href="reports.html" class="nav-link">
          <svg width="18" height="18" aria-hidden="true"><use href="../assets/icons.svg#icon-clipboard-list"></use></svg>
          My Reports
        </a>
        <a href="map.html" class="nav-link">
          <svg width="18" height="18" aria-hidden="true"><use href="../assets/icons.svg#icon-map"></use></svg>
          Civic Map
        </a>
      </nav>

      <div class="sidebar-footer">
        <a href="../authority/dashboard.html" class="nav-link">
          <svg width="18" height="18" aria-hidden="true"><use href="../assets/icons.svg#icon-shield-check"></use></svg>
          Switch to Authority View
        </a>
      </div>
    </aside>

    <div class="app-shell-main">
      <header class="header">
        <div class="header-left">
          <button type="button" aria-label="Open navigation" class="header-menu-btn">
            <svg width="20" height="20" aria-hidden="true"><use href="../assets/icons.svg#icon-menu"></use></svg>
          </button>
          <div>
            <h1 class="header-title">Report Civic Issue</h1>
            <p class="header-subtitle">Report a problem for AI analysis and routing</p>
          </div>
        </div>
        <div class="header-right">
          <div class="header-user">
            <p class="header-user-name">Aarav Shah</p>
            <p class="header-user-role">Citizen</p>
          </div>
          <span class="avatar">AS</span>
        </div>
      </header>

      <main class="app-shell-content">
        <div class="app-shell-content-inner">
          <div class="empty-state">
            <span class="empty-state-icon"><svg aria-hidden="true"><use href="../assets/icons.svg#icon-hammer"></use></svg></span>
            <h3 class="empty-state-title">Report Civic Issue</h3>
            <p class="empty-state-description">The civic issue reporting flow is coming in the next development phase.</p>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="../assets/js/sidebar.js"></script>
</body>
</html>
