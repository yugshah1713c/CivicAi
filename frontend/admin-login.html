<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Government Access — Civic AI</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/animations.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>
<canvas id="bg-particles"></canvas>
<div id="navbar" data-mode="bare"></div>

<section class="section" style="min-height:82vh; display:flex; align-items:center;">
  <div class="container" style="max-width:440px;">
    <div class="glass card reveal in" style="padding:40px 36px;">
      <div class="eyebrow">Government Console</div>
      <h2 style="font-size:28px;">Government Access</h2>
      <p style="margin-bottom:24px;">Authorized personnel only.</p>

      <form id="adminLoginForm">
        <div class="field">
          <label for="govId">Government ID</label>
          <input type="text" id="govId" placeholder="admin" required>
        </div>
        <div class="field">
          <label for="govPassword">Password</label>
          <input type="password" id="govPassword" placeholder="admin" required>
        </div>
        <button type="submit" id="adminLoginBtn" class="btn btn-primary btn-block">Login</button>
      </form>

      <div class="divider"></div>
      <a href="login.html" class="btn btn-ghost btn-block">Citizen Login</a>
      <p style="text-align:center; margin-top:20px; font-size:12.5px;">Demo credentials — ID: <span class="mono" style="color:var(--cyan-signal);">admin</span> · Password: <span class="mono" style="color:var(--cyan-signal);">admin</span></p>
    </div>
  </div>
</section>

<div id="footer"></div>
<script src="js/main.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
