<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — Civic AI</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/animations.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>
<canvas id="bg-particles"></canvas>
<div id="navbar" data-mode="bare"></div>

<section class="section" style="min-height:82vh; display:flex; align-items:center;">
  <div class="container" style="max-width:440px;">
    <div class="glass card reveal in" style="padding:40px 36px;">
      <div class="eyebrow">Citizen Access</div>
      <h2 style="font-size:28px;">Civic AI Login</h2>
      <p style="margin-bottom:24px;">Sign in to report issues and track your city's progress.</p>

      <form id="loginForm">
        <div class="field">
          <label for="username">Username</label>
          <input type="text" id="username" placeholder="demo" autocomplete="username" required>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="demo" autocomplete="current-password" required>
        </div>
        <button type="submit" id="loginBtn" class="btn btn-primary btn-block">Login</button>
      </form>

      <div class="divider"></div>
      <a href="register.html" class="btn btn-ghost btn-block" style="margin-bottom:12px;">Create Account</a>
      <a href="admin-login.html" class="btn btn-ghost btn-block">Government Access</a>

      <p style="text-align:center; margin-top:20px; font-size:12.5px;">Demo credentials — Username: <span class="mono" style="color:var(--cyan-signal);">demo</span> · Password: <span class="mono" style="color:var(--cyan-signal);">demo</span></p>
    </div>
  </div>
</section>

<div id="footer"></div>
<script src="js/main.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
